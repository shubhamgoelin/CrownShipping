<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4fa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003580;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e09010;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Box -->
  <rect x="30" y="55" width="60" height="45" fill="url(#boxGrad)" rx="3"/>

  <!-- Box Tape - Vertical -->
  <rect x="57" y="55" width="6" height="45" fill="#002060" opacity="0.3"/>

  <!-- Box Tape - Horizontal -->
  <rect x="30" y="75" width="60" height="6" fill="#002060" opacity="0.3"/>

  <!-- Box Highlight -->
  <rect x="35" y="60" width="20" height="30" fill="white" opacity="0.1" rx="2"/>

  <!-- Crown -->
  <g>
    <!-- Crown Base -->
    <rect x="38" y="48" width="44" height="6" fill="url(#crownGrad)" rx="2"/>

    <!-- Crown Points -->
    <path d="M 38 48 L 42 30 L 46 43 L 46 48 Z" fill="url(#crownGrad)"/>
    <path d="M 46 48 L 50 25 L 54 43 L 54 48 Z" fill="url(#crownGrad)"/>
    <path d="M 54 48 L 58 20 L 62 43 L 62 48 Z" fill="url(#crownGrad)"/>
    <path d="M 62 48 L 66 25 L 70 43 L 70 48 Z" fill="url(#crownGrad)"/>
    <path d="M 70 48 L 74 30 L 78 43 L 82 48 Z" fill="url(#crownGrad)"/>

    <!-- Crown Jewels -->
    <circle cx="42" cy="35" r="2.5" fill="#003580"/>
    <circle cx="50" cy="30" r="2.5" fill="#003580"/>
    <circle cx="58" cy="26" r="3" fill="#003580"/>
    <circle cx="66" cy="30" r="2.5" fill="#003580"/>
    <circle cx="74" cy="35" r="2.5" fill="#003580"/>

    <!-- Sparkle on main jewel -->
    <circle cx="57" cy="24" r="1.5" fill="white" opacity="0.8"/>
  </g>

  <!-- Handle -->
  <path d="M 45 55 Q 45 45 60 45 Q 75 45 75 55" fill="none" stroke="#003580" stroke-width="3" stroke-linecap="round"/>

  <!-- Speed Lines (indicating movement) -->
  <g opacity="0.5">
    <line x1="92" y1="65" x2="105" y2="65" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="94" y1="75" x2="108" y2="75" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="85" x2="106" y2="85" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Letter C in Box -->
  <text x="60" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">C</text>
</svg>
