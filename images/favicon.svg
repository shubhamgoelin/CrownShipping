<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#003580" rx="12"/>

  <!-- Crown -->
  <g transform="translate(32, 18)">
    <rect x="-16" y="12" width="32" height="4" fill="#f5a623" rx="1"/>
    <polygon points="-16,12 -10,4 -5,10 -5,12" fill="#f5a623"/>
